<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 align="center"><b>Hotel Room Booking Form</b></h1>
    <form action="#" align="center">
        <label for="name">Full Name:</label>
        <input type="text" placeholder="Enter your full name" id="name" name="name" required><br><br>

        <label for="email">Email:</label>
        <input type="email" placeholder="Enter your email" id="email" name="email" required><br><br>

        <label for="phone">Phone:</label>
        <input type="tel" placeholder="Enter your phone number" id="phone" name="phone" required><br><br>

        <label for="check-in-date">Check-in Date:</label>
        <input type="date" id="check-in-date" name="check-in-date" required><br><br>

        <label for="checkout-date">Checkout Date:</label>
        <input type="date" id="checkout-date" name="checkout-date" required><br><br>

        <label for="room-type">Room Type:</label>
        <select id="room-type" name="room-type">
            <option value="">Select room type</option>
            <option value="single">Single Room</option>
            <option value="double">Double Room</option>
            <option value="suite">Suite</option>
        </select><br><br>

        <label for="guests">Number of Guests:</label>
        <input type="number" id="guests" name="guests" min="1" max="10" required><br><br>

        <label for="special-requests">Special Requests:</label><br>
        <textarea id="special-requests" name="special-requests" rows="10" cols="50" placeholder="Enter any special requests"></textarea><br><br>

        <input type="submit" value="Book Now"> 
        <input type="submit" value="Reset Form"> 
    </form>    
    
</body>
</html>
