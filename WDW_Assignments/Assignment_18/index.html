<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 18 Mini Project</title>
    
</head>
<body>
    <header align="center">
        <h1>ABC College Admission Form</h1>
    </header>
    <main >
       <h2>Courses and Fees</h2>
       <section>
        <table  border="1" cellspacing="0" padding="10" width="100%" margin="10">
            <caption>Available Courses</caption>
            <thead>
                <tr>
                    <th scope="col">Courses</th>
                    <th scope="col">Seats</th>
                    <th scope="col">Fees</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>B.Tech CSE</td>
                    <td>120</td>
                    <td>&#8377;90,000</td>
                </tr>
                <tr>
                    <td>BcA</td>
                    <td>60</td>
                    <td>&#8377;45,000</td>
                </tr>
            </tbody>
         </table>
       </section>
       <br>
       <section>
        <form action="#" method="POST">
            <fieldset>
                <legend>Application Form</legend>
                <label for="name">Name:</label><br>
                <input type="text" id="name" name="name" maxlength="50" minlength="3" required><br><br>
                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email" required><br><br>
                <label for="course">Course:</label><br>
                <select id="course" name="course">
                    <option value="B.Tech CSE">B.Tech CSE</option>
                    <option value="BCA">BCA</option>
                </select><br><br>
                <label for="statement">Statement:</label><br>
                <textarea id="statement" name="statement" rows="5" cols="50" minlength="10" maxlength="200"></textarea><br><br>
                <button type="submit" >Apply</button>
            </fieldset>
        </form>
       </section> 
    </main>
    <footer align="center">
        <p>&copy; 2026 ABC College</p>
    </footer>
</body>
</html>
